<title>Ranch des Trois Générations</title>
<style>
  :root{
    --wood-dark:#2b2118;
    --wood-mid:#3d2f22;
    --wood-line:#4a3a29;
    --hay:#d4a72c;
    --hay-dim:#b08e26;
    --sage:#7a8a63;
    --sage-dim:#5f6e4c;
    --cream:#f2ead8;
    --cream-dim:#c9bfa8;
    --barn-red:#a63d33;
    --barn-red-dim:#8a3229;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 42px),
      var(--wood-dark);
    color:var(--cream);
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    min-height:100vh;
    padding-bottom:70px;
  }
  h1,h2,h3,.brand{
    font-family:Georgia, 'Times New Roman', serif;
    letter-spacing:0.02em;
  }
  .topbar{
    padding:18px 18px 16px;
    border-bottom:3px solid var(--hay);
    background:linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    position:sticky; top:0; z-index:20;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .logo-badge{
    flex:0 0 auto;
    width:58px; height:58px;
    border-radius:50%;
    background:radial-gradient(circle, #f7f2e6 55%, #e9dfc8 100%);
    box-shadow:0 2px 8px rgba(0,0,0,0.35), inset 0 0 0 2px rgba(212,167,44,0.5);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .logo-badge img{width:88%; height:88%; object-fit:contain;}
  .topbar-text{flex:1; min-width:0;}
  .topbar-actions{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .icon-btn{
    background:transparent;
    border:1px solid var(--wood-line);
    color:var(--cream-dim);
    font-size:0.65rem;
    padding:4px 8px;
    border-radius:5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .icon-btn:active{background:var(--wood-line);}
  .brand{
    font-size:1.3rem;
    font-weight:700;
    color:var(--hay);
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .brand small{
    font-family:'Segoe UI', sans-serif;
    font-size:0.65rem;
    color:var(--cream-dim);
    font-weight:400;
    letter-spacing:0.15em;
    text-transform:uppercase;
  }
  .tagline{font-size:0.78rem; color:var(--cream-dim); margin-top:4px;}

  .tabs{
    display:flex;
    overflow-x:auto;
    gap:6px;
    padding:10px 12px;
    background:var(--wood-mid);
    border-bottom:1px solid var(--wood-line);
  }
  .tab-btn{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:6px;
    border:1px solid var(--wood-line);
    background:transparent;
    color:var(--cream-dim);
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{
    background:var(--hay);
    color:var(--wood-dark);
    border-color:var(--hay);
  }

  main{padding:16px; max-width:640px; margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .section-title{
    font-size:1.1rem;
    color:var(--hay);
    margin:4px 0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .count-badge{
    font-family:'Segoe UI', sans-serif;
    font-size:0.7rem;
    background:var(--sage-dim);
    color:var(--cream);
    padding:2px 9px;
    border-radius:20px;
    font-weight:600;
  }

  .card{
    background:var(--wood-mid);
    border:1px solid var(--wood-line);
    border-left:4px solid var(--hay);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:10px;
    position:relative;
  }
  .card.expense{border-left-color:var(--barn-red);}
  .card.task{border-left-color:var(--sage);}
  .card.task.done{opacity:0.5;}
  .card.task.done .card-title{text-decoration:line-through;}
  .card.harvest{border-left-color:var(--hay);}

  .card-title{font-weight:700; font-size:0.98rem; margin-bottom:2px;}
  .card-meta{font-size:0.78rem; color:var(--cream-dim); line-height:1.5;}
  .ear-tag{
    display:inline-block;
    background:var(--hay);
    color:var(--wood-dark);
    font-size:0.68rem;
    font-weight:700;
    padding:1px 7px;
    border-radius:3px;
    margin-right:6px;
  }
  .del-btn{
    position:absolute; top:10px; right:10px;
    background:none; border:none; color:var(--cream-dim);
    font-size:1.1rem; cursor:pointer; padding:2px 6px;
    line-height:1;
  }
  .del-btn:hover{color:var(--barn-red);}
  .edit-btn{
    position:absolute; top:10px; right:38px;
    background:none; border:none; color:var(--cream-dim);
    font-size:1rem; cursor:pointer; padding:2px 6px;
    line-height:1;
  }
  .edit-btn:hover{color:var(--hay);}
  .vaccin-tag{
    margin-top:8px;
    font-size:0.76rem;
    font-weight:700;
    padding:4px 8px;
    border-radius:5px;
    display:inline-block;
  }
  .vaccin-tag.ok{background:rgba(122,138,99,0.2); color:var(--sage);}
  .vaccin-tag.soon{background:rgba(212,167,44,0.2); color:var(--hay);}
  .vaccin-tag.overdue{background:rgba(166,61,51,0.25); color:#e08276;}

  .summary-banner{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:14px;
  }
  .summary-pill{
    flex:1; min-width:150px;
    border-radius:8px;
    padding:9px 12px;
    font-size:0.8rem;
    font-weight:700;
    border:1px solid var(--wood-line);
  }
  .summary-pill.ok{background:rgba(122,138,99,0.12); color:var(--sage); border-color:rgba(122,138,99,0.3);}
  .summary-pill.overdue{background:rgba(166,61,51,0.16); color:#e08276; border-color:rgba(166,61,51,0.4);}
  .summary-pill .n{font-size:1rem;}

  .feed-banner{
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:14px;
    border:1px solid var(--wood-line);
  }
  .feed-banner.ok{background:rgba(122,138,99,0.12); border-color:rgba(122,138,99,0.3);}
  .feed-banner.warn{background:rgba(212,167,44,0.14); border-color:rgba(212,167,44,0.4);}
  .feed-banner.overdue{background:rgba(166,61,51,0.16); border-color:rgba(166,61,51,0.4);}
  .feed-banner .big{font-size:1.05rem; font-weight:700; margin-bottom:2px;}
  .feed-banner.ok .big{color:var(--sage);}
  .feed-banner.warn .big{color:var(--hay);}
  .feed-banner.overdue .big{color:#e08276;}
  .feed-banner .small{font-size:0.78rem; color:var(--cream-dim);}
  .feed-quick-btn{
    margin-top:10px;
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    background:var(--hay);
    color:var(--wood-dark);
    font-weight:700;
    font-size:0.9rem;
    cursor:pointer;
  }
  .check-btn{
    position:absolute; top:12px; right:38px;
    width:20px; height:20px;
    border:2px solid var(--sage);
    border-radius:4px;
    background:transparent;
    cursor:pointer;
  }
  .check-btn.checked{background:var(--sage);}
  .check-btn.checked::after{content:"✓"; color:var(--wood-dark); font-size:0.8rem; font-weight:900; display:block; line-height:1;}

  .empty-state{
    text-align:center;
    padding:30px 16px;
    color:var(--cream-dim);
    font-size:0.9rem;
    border:1px dashed var(--wood-line);
    border-radius:8px;
  }

  .fab{
    position:fixed;
    bottom:20px; right:20px;
    width:56px; height:56px;
    border-radius:50%;
    background:var(--hay);
    color:var(--wood-dark);
    font-size:1.8rem;
    border:none;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    cursor:pointer;
    z-index:25;
    display:flex; align-items:center; justify-content:center;
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:flex-end;
    z-index:30;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--wood-mid);
    border-top:3px solid var(--hay);
    border-radius:16px 16px 0 0;
    width:100%;
    max-width:640px;
    margin:0 auto;
    padding:20px 18px 26px;
    max-height:85vh;
    overflow-y:auto;
  }
  .modal h3{color:var(--hay); margin-top:0;}
  label{
    display:block;
    font-size:0.78rem;
    color:var(--cream-dim);
    margin:12px 0 5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  input, select, textarea{
    width:100%;
    padding:10px 11px;
    border-radius:6px;
    border:1px solid var(--wood-line);
    background:var(--wood-dark);
    color:var(--cream);
    font-size:0.95rem;
    font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--hay);}
  .modal-actions{
    display:flex; gap:10px; margin-top:20px;
  }
  .btn{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-weight:700;
    font-size:0.9rem;
    cursor:pointer;
  }
  .btn-primary{background:var(--hay); color:var(--wood-dark);}
  .btn-ghost{background:transparent; border:1px solid var(--wood-line); color:var(--cream-dim);}

  .summary-row{
    display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;
  }
  .stat{
    flex:1; min-width:120px;
    background:var(--wood-mid);
    border:1px solid var(--wood-line);
    border-radius:8px;
    padding:10px 12px;
  }
  .stat .num{font-size:1.3rem; font-weight:700; color:var(--hay);}
  .stat .lbl{font-size:0.7rem; color:var(--cream-dim); text-transform:uppercase; letter-spacing:0.04em;}

  .loading{text-align:center; padding:40px; color:var(--cream-dim);}

  #login-screen{
    position:fixed; inset:0;
    background:var(--wood-dark);
    z-index:100;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  #login-screen.hidden{display:none;}
  .login-box{
    width:100%; max-width:360px;
    background:var(--wood-mid);
    border:1px solid var(--wood-line);
    border-top:3px solid var(--hay);
    border-radius:12px;
    padding:28px 22px;
    text-align:center;
  }
  .login-logo{width:80px; height:80px; border-radius:50%;
    background:radial-gradient(circle, #f7f2e6 55%, #e9dfc8 100%);
    margin:0 auto 16px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.35);
  }
  .login-logo img{width:88%; height:88%; object-fit:contain;}
  .login-box h2{color:var(--hay); margin:0 0 4px; font-size:1.2rem;}
  .login-box p{color:var(--cream-dim); font-size:0.82rem; margin:0 0 18px;}
  .login-error{color:#e08276; font-size:0.82rem; margin-top:10px; min-height:1.2em;}
  #app-root.hidden{display:none;}
  .topbar-signout{
    background:transparent; border:1px solid var(--wood-line);
    color:var(--cream-dim); font-size:0.65rem; padding:4px 8px;
    border-radius:5px; cursor:pointer; white-space:nowrap;
  }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtYGs-Dhu4Tbr-yT6Lbb92wqTPaYkGvNI",
  authDomain: "ranch-des-trois-generations.firebaseapp.com",
  projectId: "ranch-des-trois-generations",
  storageBucket: "ranch-des-trois-generations.firebasestorage.app",
  messagingSenderId: "916705893528",
  appId: "1:916705893528:web:f24957a97af9facec0c4ed"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const docRef = doc(db, "ranch3g", "data");
const auth = getAuth(fbApp);
await setPersistence(auth, browserLocalPersistence);

const STORE = {
  cheptel: "ranch3g:cheptel",
  depenses: "ranch3g:depenses",
  taches: "ranch3g:taches",
  recoltes: "ranch3g:recoltes",
  nourrissage: "ranch3g:nourrissage"
};

// Persistence layer — Firestore is the source of truth (synced in real time
// between every device), with localStorage as an offline fallback cache.
let suppressNextSnapshot = false;

const storage = {
  async get(key){
    const field = key.split(':')[1];
    try{
      const snap = await getDoc(docRef);
      if(snap.exists() && snap.data()[field] !== undefined){
        return { value: snap.data()[field] };
      }
    }catch(e){ console.error('Firestore get error', e); }
    const v = localStorage.getItem(key);
    return v === null ? null : { value: v };
  },
  async set(key, value){
    const field = key.split(':')[1];
    localStorage.setItem(key, value);
    try{
      suppressNextSnapshot = true;
      await setDoc(docRef, {[field]: value}, {merge:true});
    }catch(e){ console.error('Firestore sync error', e); }
    return { value };
  }
};

let state = { cheptel: [], depenses: [], taches: [], recoltes: [], nourrissage: [] };
let currentTab = "cheptel";

async function loadAll(){
  for(const key of Object.keys(STORE)){
    try{
      const res = await storage.get(STORE[key]);
      state[key] = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      state[key] = [];
    }
  }
  // Seed with known animals and tomorrow's tasks — completes anything missing,
  // safe to run even if some data already exists (checks by name, no duplicates)
  const cheptelNames = state.cheptel.map(a => a.nom);
  const seedAnimals = [
    {nom:"Vache WJ-1", race:"Wagyu-Jersey", sexe:"Femelle", age:"12 mois",
     statut:"Pas encore saillie (viser ~14-15 mois)"},
    {nom:"Bouvillon WJ-1", race:"Wagyu-Jersey", sexe:"Mâle castré", age:"12 mois",
     statut:"Destiné à l'engraissement/boucherie"},
    {nom:"Taureau SP-1", race:"Speckle Park", sexe:"Mâle entier", age:"8 mois",
     statut:"Séparé de la vache — trop jeune pour saillie"},
    {nom:"Cheval 1", race:"Cheval", sexe:"—", age:"", statut:""},
    {nom:"Cheval 2", race:"Cheval", sexe:"—", age:"", statut:""},
    {nom:"Poney 1", race:"Poney", sexe:"—", age:"", statut:""}
  ];
  let cheptelChanged = false;
  for(const a of seedAnimals){
    if(!cheptelNames.includes(a.nom)){
      state.cheptel.push({id: cryptoId(), ...a});
      cheptelChanged = true;
    }
  }
  if(cheptelChanged) await save("cheptel");

  const tacheTitres = state.taches.map(t => t.titre);
  const seedTaches = [
    "Séparer le taureau Speckle Park de la vache — priorité immédiate",
    "Appeler le MAPAQ Sainte-Martine (450 427-2000) — conseiller relève secteur Ouest",
    "Ouvrir un dossier client à la FADQ",
    "Appeler le Centre de services scolaire de la Vallée-des-Tisserands (RAC / TENS)",
    "Noter le rendement de vos 16 acres de foin",
    "Demander au MAPAQ si le déboisement pour pâturage est subventionné",
    "Vérifier les exigences réglementaires du déboisement (MFFP, CPTAQ/MRC)",
    "Demander des soumissions pour déchiquetage forestier (forestry mulching)"
  ];
  let tachesChanged = false;
  for(const titre of seedTaches){
    if(!tacheTitres.includes(titre)){
      state.taches.push({id: cryptoId(), titre, echeance:"", fait:false});
      tachesChanged = true;
    }
  }
  if(tachesChanged) await save("taches");

  renderAll();

  // Live sync: reflect changes made from another device (e.g. votre conjointe) automatically
  onSnapshot(docRef, (snap)=>{
    if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
    if(!snap.exists()) return;
    const data = snap.data();
    let changed = false;
    for(const key of Object.keys(STORE)){
      const field = key.split(':')[1];
      if(data[field] !== undefined){
        try{
          const parsed = JSON.parse(data[field]);
          if(JSON.stringify(parsed) !== JSON.stringify(state[key])){
            state[key] = parsed;
            localStorage.setItem(STORE[key], data[field]);
            changed = true;
          }
        }catch(e){}
      }
    }
    if(changed) renderAll();
  }, (err)=>{ console.error('Sync listener error', err); });
}
function cryptoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function save(key){
  await storage.set(STORE[key], JSON.stringify(state[key]));
}

function renderAll(){
  renderCheptel();
  renderDepenses();
  renderTaches();
  renderRecoltes();
  renderNourrissage();
}

function vaccinStatus(dateStr, label){
  if(!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const due = new Date(dateStr + 'T00:00:00');
  const diffDays = Math.round((due - today) / 86400000);
  if(diffDays < 0) return {label:`${label} en retard (${esc(dateStr)})`, level:'overdue', diffDays};
  if(diffDays <= 14) return {label:`${label} dans ${diffDays} j (${esc(dateStr)})`, level:'soon', diffDays};
  return {label:`Prochaine ${label.toLowerCase()} : ${esc(dateStr)}`, level:'ok', diffDays};
}

function renderCheptelSummary(){
  const el = document.getElementById('summary-cheptel');
  let overdue = 0, soon = 0;
  state.cheptel.forEach(a=>{
    [vaccinStatus(a.prochaineVaccin,'Vaccination'), vaccinStatus(a.prochaineVermifuge,'Vermifuge')].forEach(vs=>{
      if(vs && vs.level==='overdue') overdue++;
      else if(vs && vs.level==='soon') soon++;
    });
  });
  if(overdue===0 && soon===0){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="summary-banner">
    ${overdue>0? `<div class="summary-pill overdue">⚠️ <span class="n">${overdue}</span> rappel(s) en retard</div>`:''}
    ${soon>0? `<div class="summary-pill ok">⏰ <span class="n">${soon}</span> rappel(s) à venir (14 j)</div>`:''}
  </div>`;
}

function renderCheptel(){
  const list = document.getElementById("list-cheptel");
  document.getElementById("count-cheptel").textContent = state.cheptel.length;
  renderCheptelSummary();
  if(state.cheptel.length === 0){
    list.innerHTML = `<div class="empty-state">Aucune bête enregistrée. Touchez + pour en ajouter une.</div>`;
    return;
  }
  list.innerHTML = state.cheptel.map(a => {
    const vv = vaccinStatus(a.prochaineVaccin, 'Vaccination');
    const vw = vaccinStatus(a.prochaineVermifuge, 'Vermifuge');
    const tags = [vv,vw].filter(Boolean).map(vs=>
      `<div class="vaccin-tag ${vs.level}">${vs.level==='overdue'?'⚠️ ':vs.level==='soon'?'⏰ ':'💉 '}${vs.label}</div>`
    ).join('');
    return `
    <div class="card">
      <button class="edit-btn" onclick="openCheptelForm('${a.id}')">✎</button>
      <button class="del-btn" onclick="removeItem('cheptel','${a.id}')">✕</button>
      <div class="card-title">${a.tag? `<span class="ear-tag">#${esc(a.tag)}</span>` : (a.race? `<span class="ear-tag">${esc(a.race)}</span>`:'')}${esc(a.nom)}</div>
      <div class="card-meta">${esc(a.race||'')}${a.race?' · ':''}${esc(a.sexe||'')} · ${esc(a.age||'')}${a.statut? ' · '+esc(a.statut):''}</div>
      ${tags}
    </div>`;
  }).join('');
}

function timeAgoLabel(iso){
  const then = new Date(iso);
  const diffMin = Math.round((Date.now() - then.getTime())/60000);
  if(diffMin < 1) return "à l'instant";
  if(diffMin < 60) return `il y a ${diffMin} min`;
  const diffH = Math.floor(diffMin/60);
  const remMin = diffMin % 60;
  if(diffH < 24) return `il y a ${diffH} h${remMin? ' '+remMin+' min':''}`;
  const diffJ = Math.floor(diffH/24);
  return `il y a ${diffJ} j`;
}

function renderNourrissageSummary(){
  const el = document.getElementById('summary-nourrissage');
  if(state.nourrissage.length === 0){ el.innerHTML=''; return; }
  const sorted = [...state.nourrissage].sort((a,b)=> new Date(b.horodatage) - new Date(a.horodatage));
  const last = sorted[0];
  const diffH = (Date.now() - new Date(last.horodatage).getTime())/3600000;
  let level = 'ok';
  if(diffH >= 14) level = 'overdue';
  else if(diffH >= 10) level = 'warn';
  el.innerHTML = `<div class="feed-banner ${level}">
    <div class="big">${level==='overdue'?'⚠️ ':level==='warn'?'⏰ ':'✅ '}Dernière nourriture : ${timeAgoLabel(last.horodatage)}</div>
    <div class="small">Par ${esc(last.personne)}${last.notes? ' · '+esc(last.notes):''}</div>
    <button class="feed-quick-btn" onclick="openNourrissageForm()">🌾 Enregistrer un nourrissage</button>
  </div>`;
}

function renderNourrissage(){
  const list = document.getElementById("list-nourrissage");
  document.getElementById("count-nourrissage").textContent = state.nourrissage.length;
  renderNourrissageSummary();

    list.innerHTML = `<div class="empty-state">Aucun nourrissage enregistré. Touchez + pour en ajouter un.</div>`;
    return;
  }
  const sorted = [...state.nourrissage].sort((a,b)=> new Date(b.horodatage) - new Date(a.horodatage));
  list.innerHTML = sorted.map(n => `
    <div class="card">
      <button class="del-btn" onclick="removeItem('nourrissage','${n.id}')">✕</button>
      <div class="card-title">🌾 ${esc(n.personne)}</div>
      <div class="card-meta">${formatDT(n.horodatage)}${n.notes? ' · '+esc(n.notes):''}</div>
    </div>
  `).join('');
}

function formatDT(iso){
  const d = new Date(iso);
  return d.toLocaleString('fr-CA', {dateStyle:'short', timeStyle:'short'});
}

function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s){ return esc(s); }

const DELETE_LABELS = {
  cheptel: (x)=> `la bête « ${x.nom||'sans nom'} »`,
  depenses: (x)=> `la dépense « ${x.description||''} »`,
  taches: (x)=> `la tâche « ${x.titre||''} »`,
  recoltes: (x)=> `la récolte « ${x.type||''} »`,
  nourrissage: (x)=> `cet enregistrement de nourrissage`
};

window.removeItem = async function(key, id){
  const item = state[key].find(x=>x.id===id);
  const label = item && DELETE_LABELS[key] ? DELETE_LABELS[key](item) : 'cet élément';
  if(!confirm(`Supprimer ${label} ? Cette action est irréversible.`)) return;
  state[key] = state[key].filter(x=>x.id!==id);
  await save(key);
  renderAll();
};

window.toggleTask = async function(id){
  const t = state.taches.find(x=>x.id===id);
  if(t){ t.fait = !t.fait; await save('taches'); renderTaches(); }
};

window.submitCheptel = async function(editId){
  const nom = document.getElementById('f-nom').value.trim();
  if(!nom) return;
  const payload = {
    nom,
    tag: document.getElementById('f-tag').value.trim(),
    race: document.getElementById('f-race').value.trim(),
    sexe: document.getElementById('f-sexe').value,
    age: document.getElementById('f-age').value.trim(),
    statut: document.getElementById('f-statut').value.trim(),
    derniereVaccin: document.getElementById('f-derniere-vaccin').value,
    prochaineVaccin: document.getElementById('f-prochaine-vaccin').value,
    derniereVermifuge: document.getElementById('f-derniere-vermifuge').value,
    prochaineVermifuge: document.getElementById('f-prochaine-vermifuge').value
  };
  if(editId){
    const idx = state.cheptel.findIndex(x=>x.id===editId);
    if(idx>-1) state.cheptel[idx] = {...state.cheptel[idx], ...payload};
  }else{
    state.cheptel.push({ id: cryptoId(), ...payload });
  }
  await save('cheptel');
  renderCheptel();
  closeModal();
};

}

// Auth gating
const loginScreen = document.getElementById('login-screen');
const appRoot = document.getElementById('app-root');
const loginError = document.getElementById('login-error');
let appLoaded = false;

onAuthStateChanged(auth, (user)=>{
  if(user){
    loginScreen.classList.add('hidden');
    appRoot.classList.remove('hidden');
    if(!appLoaded){
      appLoaded = true;
      loadAll();
    }
  }else{
    loginScreen.classList.remove('hidden');
    appRoot.classList.add('hidden');
  }
});

document.getElementById('login-submit').addEventListener('click', async ()=>{
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  loginError.textContent = '';
  if(!email || !password){ loginError.textContent = 'Entrez votre courriel et mot de passe.'; return; }
  try{
    await signInWithEmailAndPassword(auth, email, password);
  }catch(e){
    loginError.textContent = "Courriel ou mot de passe incorrect.";
  }
});

document.getElementById('login-password').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('login-submit').click();
});

document.getElementById('btn-signout').addEventListener('click', ()=>{
  signOut(auth);
});

// Backup / restore
document.getElementById('btn-export').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `ranch_3g_sauvegarde_${d}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('btn-import').addEventListener('click', ()=>{
  document.getElementById('file-import').click();
});

document.getElementById('file-import').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(data.cheptel) state.cheptel = data.cheptel;
    if(data.depenses) state.depenses = data.depenses;
    if(data.taches) state.taches = data.taches;
    if(data.recoltes) state.recoltes = data.recoltes;
    if(data.nourrissage) state.nourrissage = data.nourrissage;
    await save('cheptel');
    await save('depenses');
    await save('taches');
    await save('recoltes');
    await save('nourrissage');
    renderAll();
    alert('Données restaurées avec succès.');
  }catch(err){
    alert("Le fichier n'a pas pu être lu. Assurez-vous qu'il s'agit d'un fichier de sauvegarde valide.");
  }
  e.target.value = '';
});
